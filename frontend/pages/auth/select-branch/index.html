<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chọn cơ sở · HappyKidsCK</title>
    <link rel="icon" href="../../../assets/img/brand/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/base/typography.css">
    <link rel="stylesheet" href="../../../assets/css/base/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/base/reset.css">
    <link rel="stylesheet" href="../../../assets/css/base/ui.css">
    <link rel="stylesheet" href="../../../assets/css/layout/auth.css">
    <link rel="stylesheet" href="../../../assets/css/pages/auth/select-branch.css">
    <script src="../../../assets/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="../../../assets/js/app.js"></script>
    <script type="module" src="../../../assets/js/pages/auth/select-branch.js"></script>
</head>
<body data-auth="required" data-layout="auth">
    <div class="branch-picker">
        <div class="auth-card__logo-mobile">
            <img src="../../../assets/img/brand/logo.svg" alt="" width="40" height="40">
            <span>HappyKidsCK</span>
        </div>

        <h1 class="auth-title">Chọn cơ sở làm việc</h1>
        <p class="auth-subtitle">Dữ liệu học viên, điểm danh và học phí sẽ hiển thị theo cơ sở bạn chọn. Có thể đổi lại bất cứ lúc nào ở thanh trên cùng.</p>

        <div class="branch-picker__list" data-branch-list>
            <div class="branch-picker__loading">
                <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>Đang tải danh sách cơ sở...
            </div>
        </div>

        <div class="branch-picker__empty" data-branch-empty hidden>
            <div class="alert alert-warning mb-0">Tài khoản của bạn chưa được phân công cơ sở nào. Vui lòng liên hệ quản trị viên để được cấp quyền.</div>
        </div>

        <div class="branch-picker__foot">
            <a href="../../../pages/auth/login/" class="branch-picker__link" data-action="logout-link"><i class="bi bi-box-arrow-right me-1"></i>Đăng xuất</a>
        </div>
    </div>
</body>
</html>
