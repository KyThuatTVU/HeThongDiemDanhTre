<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ cơ sở · HappyKidsCK</title>
    <link rel="icon" href="../../../assets/img/brand/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/base/typography.css">
    <link rel="stylesheet" href="../../../assets/css/base/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/base/reset.css">
    <link rel="stylesheet" href="../../../assets/css/base/ui.css">
    <link rel="stylesheet" href="../../../assets/css/layout/app.css">
    <link rel="stylesheet" href="../../../assets/css/pages/branches/form.css">
    <script src="../../../assets/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="../../../assets/js/app.js"></script>
    <script type="module" src="../../../assets/js/pages/branches/form.js"></script>
</head>
<body data-auth="required" data-layout="dashboard" data-page="branches">
    <div class="page-stack">
        <div data-component="page-header"
             data-title="Thêm cơ sở"
             data-subtitle="Khai báo thông tin cơ sở mới của trung tâm"
             data-breadcrumb='[{"label":"Cơ sở","href":"../../branches/list/"},{"label":"Hồ sơ"}]'></div>

        <form class="branch-form" data-branch-form novalidate>
            <section class="card card-pad">
                <div class="section-head">
                    <div>
                        <h2 class="section-title">Thông tin cơ sở</h2>
                        <p class="section-subtitle">Mã cơ sở dùng để phân biệt dữ liệu giữa các chi nhánh</p>
                    </div>
                </div>
                <div class="form-grid">
                    <div class="hk-field span-4">
                        <label class="form-label" for="code">Mã cơ sở <span class="required">*</span></label>
                        <input class="form-control" id="code" name="code" type="text" maxlength="20"
                               placeholder="VD: TN, CL" autocomplete="off" required>
                    </div>
                    <div class="hk-field span-8">
                        <label class="form-label" for="name">Tên cơ sở <span class="required">*</span></label>
                        <input class="form-control" id="name" name="name" type="text" maxlength="120"
                               placeholder="VD: Cơ sở Tân Nhựt" autocomplete="off" required>
                    </div>
                    <div class="hk-field span-8">
                        <label class="form-label" for="address">Địa chỉ</label>
                        <input class="form-control" id="address" name="address" type="text" maxlength="255" autocomplete="off">
                    </div>
                    <div class="hk-field span-4">
                        <label class="form-label" for="phone">Điện thoại</label>
                        <input class="form-control" id="phone" name="phone" type="tel" maxlength="30" inputmode="tel">
                    </div>
                    <div class="hk-field span-4" data-status-field hidden>
                        <label class="form-label" for="status">Trạng thái</label>
                        <select class="form-select" id="status" name="status">
                            <option value="active">Đang hoạt động</option>
                            <option value="inactive">Ngừng hoạt động</option>
                        </select>
                    </div>
                </div>
            </section>

            <section class="card card-pad" data-logo-row hidden>
                <div class="section-head">
                    <div>
                        <h2 class="section-title">Logo cơ sở</h2>
                        <p class="section-subtitle">Hiển thị tại màn hình chọn cơ sở và phần đầu trang</p>
                    </div>
                </div>
                <div class="upload-row">
                    <span class="branch-logo branch-logo--lg" data-logo><i class="bi bi-buildings"></i></span>
                    <div>
                        <label class="btn-hk-outline btn-sm mb-0" for="branch-logo-input">
                            <i class="bi bi-image me-1"></i>Chọn logo
                        </label>
                        <input id="branch-logo-input" type="file" accept="image/jpeg,image/png,image/webp" hidden data-logo-input>
                        <p class="fs-13 text-muted-2 mb-0 mt-1">JPG/PNG/WEBP, tối đa 2MB.</p>
                    </div>
                </div>
            </section>

            <div class="form-actions">
                <span class="form-hint" data-form-hint></span>
                <a class="btn-hk-outline" href="../list/">Huỷ</a>
                <button class="btn-hk" type="submit" data-submit>
                    <i class="bi bi-check2 me-1"></i><span data-submit-text>Lưu cơ sở</span>
                </button>
            </div>
        </form>
    </div>
</body>
</html>
