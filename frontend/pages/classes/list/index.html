<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lớp học · HappyKidsCK</title>
    <link rel="icon" href="../../../assets/img/brand/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/base/typography.css">
    <link rel="stylesheet" href="../../../assets/css/base/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/base/reset.css">
    <link rel="stylesheet" href="../../../assets/css/base/ui.css">
    <link rel="stylesheet" href="../../../assets/css/layout/app.css">
    <link rel="stylesheet" href="../../../assets/css/pages/classes/list.css">
    <script src="../../../assets/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="../../../assets/js/app.js"></script>
    <script type="module" src="../../../assets/js/pages/classes/list.js"></script>
</head>
<body data-auth="required" data-layout="dashboard" data-page="classes">
    <div class="page-stack">
        <div data-component="page-header"
             data-title="Lớp học"
             data-subtitle="Lớp đang theo dõi tại cơ sở hiện tại"
             data-breadcrumb='[{"label":"Lớp học"}]'></div>

        <div data-component="table-toolbar">
            <template data-slot="filters">
                <div class="hk-field hk-field--wide">
                    <label class="visually-hidden" for="class-search">Tìm lớp</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
                        <input type="search" class="form-control" id="class-search" placeholder="Tìm theo tên lớp hoặc ghi chú..." data-search-input>
                    </div>
                </div>
                <div class="hk-field">
                    <label class="visually-hidden" for="class-status">Trạng thái</label>
                    <select class="form-select" id="class-status" data-filter-status>
                        <option value="">Tất cả trạng thái</option>
                        <option value="active">Đang hoạt động</option>
                        <option value="inactive">Đã ngừng</option>
                    </select>
                </div>
            </template>
            <template data-slot="actions">
                <a class="btn-hk" href="../form/" data-permission="classes.create">
                    <i class="bi bi-plus-lg me-1"></i>Thêm lớp
                </a>
            </template>
        </div>

        <div class="section-grid class-overview">
            <div class="card table-card">
                <div data-classes-table></div>
            </div>
            <aside class="card card-pad class-note">
                <h2 class="section-title">Gợi ý quản lý lớp</h2>
                <ul class="class-note__list">
                    <li><i class="bi bi-check2-circle"></i>Mỗi học viên chỉ thuộc một lớp hiện tại; lịch sử chuyển lớp được lưu tự động.</li>
                    <li><i class="bi bi-check2-circle"></i>Lớp "ngừng hoạt động" vẫn giữ học viên cũ nhưng không thể gán thêm.</li>
                    <li><i class="bi bi-check2-circle"></i>Điểm danh và học phí tính theo cơ sở, không phụ thuộc tên lớp.</li>
                </ul>
                <a class="btn-hk-outline w-100" href="../../attendance/today/" data-permission="attendance.view">
                    <i class="bi bi-calendar2-check me-1"></i>Điểm danh hôm nay
                </a>
            </aside>
        </div>
    </div>
</body>
</html>
