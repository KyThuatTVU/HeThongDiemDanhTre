<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tổng hợp điểm danh · HappyKidsCK</title>
    <link rel="icon" href="../../../assets/img/brand/logo.svg" type="image/svg+xml">
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="../../../assets/vendor/bootstrap-icons/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../../../assets/css/base/typography.css">
    <link rel="stylesheet" href="../../../assets/css/base/tokens.css">
    <link rel="stylesheet" href="../../../assets/css/base/reset.css">
    <link rel="stylesheet" href="../../../assets/css/base/ui.css">
    <link rel="stylesheet" href="../../../assets/css/layout/app.css">
    <script src="../../../assets/vendor/bootstrap/bootstrap.bundle.min.js" defer></script>
    <script type="module" src="../../../assets/js/app.js"></script>
    <script type="module" src="../../../assets/js/pages/reports/attendance-summary.js"></script>
</head>
<body data-auth="required" data-layout="dashboard" data-page="reports">
    <div class="page-stack">
        <div data-component="page-header"
             data-title="Tổng hợp điểm danh tháng"
             data-subtitle="Thống kê số buổi có mặt, vắng và tỉ lệ điểm danh từng học viên"
             data-breadcrumb='[{"label":"Báo cáo"},{"label":"Tổng hợp tháng"}]'></div>

        <div data-component="report-tabs" data-active="attendance-summary"></div>

        <div class="stat-grid">
            <div data-component="stat-card" data-metric="total" data-tone="brand" data-icon="bi-journal-check"
                 data-label="Tổng lượt ghi nhận" data-value="—" data-hint="Đang tải..."></div>
            <div data-component="stat-card" data-metric="present" data-tone="success" data-icon="bi-check2-circle"
                 data-label="Lượt có mặt" data-value="—" data-hint="Đang tải..."></div>
            <div data-component="stat-card" data-metric="absent" data-tone="danger" data-icon="bi-person-dash"
                 data-label="Lượt vắng" data-value="—" data-hint="Đang tải..."></div>
            <div data-component="stat-card" data-metric="rate" data-tone="accent" data-icon="bi-graph-up-arrow"
                 data-label="Tỉ lệ có mặt" data-value="—" data-hint="Đang tải..."></div>
        </div>

        <div data-component="table-toolbar">
            <template data-slot="filters">
                <div class="hk-field">
                    <label class="form-label" for="report-sum-month">Tháng</label>
                    <select class="form-select" id="report-sum-month" data-report-month></select>
                </div>
                <div class="hk-field">
                    <label class="form-label" for="report-sum-year">Năm</label>
                    <select class="form-select" id="report-sum-year" data-report-year></select>
                </div>
                <div class="hk-field" data-class-filter hidden>
                    <label class="form-label" for="report-sum-class">Lớp học</label>
                    <select class="form-select" id="report-sum-class" data-report-class>
                        <option value="">Tất cả lớp</option>
                    </select>
                </div>
            </template>
        </div>

        <div class="card table-card">
            <div class="table-card__head">
                <h2 class="table-card__title">Tổng hợp theo học viên</h2>
                <div class="d-flex gap-2">
                    <span class="hk-chip" data-report-period>—</span>
                    <span class="hk-chip" data-report-total>—</span>
                </div>
            </div>
            <div data-report-table></div>
        </div>
    </div>
</body>
</html>
