<section class="att-board" data-att-board>
    <div class="att-class-tabs" data-att-class-tabs hidden></div>

    <div class="card card-pad att-filters">
        <div class="att-filters__top">
            <div class="att-field att-field--search">
                <label class="form-label" for="att-search">Tìm nhanh học viên</label>
                <div class="input-group">
                    <span class="input-group-text bg-transparent"><i class="bi bi-search"></i></span>
                    <input class="form-control" id="att-search" type="search"
                           placeholder="Nhập tên hoặc mã học viên..." data-att-search autocomplete="off">
                </div>
            </div>
            <button type="button" class="btn-hk-outline att-filter-toggle" data-att-filter-toggle aria-expanded="false">
                <i class="bi bi-sliders2 me-1"></i>Lọc
            </button>
        </div>

        <div class="att-filters__extras" data-att-filter-extras>
            <div class="att-field att-field--class">
                <label class="form-label" for="att-class">Lọc theo lớp</label>
                <select class="form-select" id="att-class" data-att-class>
                    <option value="">Tất cả học viên</option>
                </select>
            </div>
            <div class="att-field">
                <label class="form-label" for="att-date">Ngày điểm danh</label>
                <input class="form-control" id="att-date" type="date" data-att-date>
            </div>
            <div class="att-field att-field--slot">
                <label class="form-label" for="att-slot">Ca học</label>
                <input class="form-control" id="att-slot" type="text" maxlength="50" value="Chính"
                       placeholder="Chính" data-att-slot>
            </div>
            <div class="att-filters__actions">
                <button type="button" class="btn-hk-outline" data-att-load title="Tải lại dữ liệu">
                    <i class="bi bi-arrow-repeat"></i>
                </button>
            </div>
        </div>
    </div>

    <div class="att-summary">
        <button type="button" class="att-summary__item att-summary__item--total is-active" data-status-filter="all" aria-pressed="true">
            <span class="att-summary__label">Tổng</span>
            <strong class="att-summary__value" data-att-total>0</strong>
        </button>
        <button type="button" class="att-summary__item att-summary__item--present" data-status-filter="present" aria-pressed="false">
            <span class="att-summary__label">Có mặt</span>
            <strong class="att-summary__value" data-att-present>0</strong>
        </button>
        <button type="button" class="att-summary__item att-summary__item--absent" data-status-filter="absent" aria-pressed="false">
            <span class="att-summary__label">Vắng</span>
            <strong class="att-summary__value" data-att-absent>0</strong>
        </button>
        <button type="button" class="att-summary__item att-summary__item--unrecorded" data-status-filter="unrecorded" aria-pressed="false">
            <span class="att-summary__label">Chưa ghi</span>
            <strong class="att-summary__value" data-att-unrecorded>0</strong>
        </button>
        <div class="att-summary__spacer"></div>
        <button type="button" class="btn-hk-outline btn-sm att-compact-btn" data-att-compact aria-pressed="false"
                title="Thu gọn để xem nhiều học viên trên 1 màn hình">
            <i class="bi bi-arrows-angle-contract me-1"></i><span>Xem gọn</span>
        </button>
        <div class="att-summary__status" data-att-lock-status></div>
        <div class="att-summary__buttons" data-att-lock-actions></div>
    </div>

    <div class="att-banner" data-att-banner hidden></div>

    <div class="card table-card">
        <div class="table-card__head">
            <div>
                <h2 class="table-card__title" data-att-title>Đang tải danh sách điểm danh...</h2>
                <p class="section-subtitle" data-att-subtitle hidden></p>
            </div>
            <div class="att-savebar" data-att-savebar>
                <button type="button" class="btn-hk-outline btn-sm" data-att-mark-all>
                    <i class="bi bi-check2-all me-1"></i>Tất cả có mặt
                </button>
                <button type="button" class="btn-hk btn-sm" data-att-save>
                    <i class="bi bi-save me-1"></i>Lưu điểm danh
                </button>
            </div>
        </div>
        <div data-att-table></div>
    </div>

    <div class="att-mobile-bar" data-att-savebar>
        <div class="att-mobile-bar__stats">
            <span class="text-success">✓ <strong data-att-present>0</strong></span>
            <span class="text-danger">Vắng <strong data-att-absent>0</strong></span>
            <span class="text-muted-2">Chưa <strong data-att-unrecorded>0</strong></span>
        </div>
        <div class="att-mobile-bar__actions">
            <button type="button" class="btn-hk-outline btn-sm" data-att-mark-all>
                <i class="bi bi-check2-all me-1"></i>Đủ mặt
            </button>
            <button type="button" class="btn-hk btn-sm" data-att-save>
                <i class="bi bi-save me-1"></i>Lưu
            </button>
        </div>
    </div>
</section>
