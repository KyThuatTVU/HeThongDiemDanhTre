<header class="topbar">
    <button type="button" class="topbar__icon-btn d-lg-none" data-action="toggle-sidebar" aria-label="Mở menu">
        <i class="bi bi-list"></i>
    </button>

    <div class="topbar__context">
        <p class="topbar__greeting" data-topbar-greeting>Xin chào</p>
        <p class="topbar__date" data-topbar-date></p>
    </div>

    <div class="topbar__actions">
        <label class="topbar__branch">
            <i class="bi bi-geo-alt-fill"></i>
            <span class="topbar__branch-label">Cơ sở</span>
            <select class="form-select form-select-sm" data-branch-select aria-label="Chọn cơ sở làm việc"></select>
        </label>

        <div class="dropdown">
            <button type="button" class="topbar__user" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="hk-avatar hk-avatar--sm hk-avatar--fallback" data-topbar-avatar>?</span>
                <span class="topbar__user-text">
                    <strong data-topbar-name>Đang tải...</strong>
                    <small data-topbar-role></small>
                </span>
                <i class="bi bi-chevron-down topbar__caret"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end topbar__menu">
                <li><a class="dropdown-item" href="../../../pages/profile/account/"><i class="bi bi-person-gear me-2"></i>Tài khoản của tôi</a></li>
                <li><a class="dropdown-item" href="../../../pages/auth/select-branch/"><i class="bi bi-arrow-left-right me-2"></i>Đổi cơ sở</a></li>
                <li><hr class="dropdown-divider"></li>
                <li><button type="button" class="dropdown-item text-danger" data-action="logout"><i class="bi bi-box-arrow-right me-2"></i>Đăng xuất</button></li>
            </ul>
        </div>
    </div>
</header>
